{{- $ns := .Values.namespace.name | default "" -}}
{{- $svc := .Values.serviceaccount -}}
{{- $enabled := false -}}
{{- $saName := "" -}}

{{- if kindIs "map" $svc -}}
  {{- $enabled = (dig "tokenSecret" "enabled" $svc false) -}}
  {{- $saName = (get $svc "name" | default "") -}}
{{- end -}}

{{- if and $enabled $saName $ns }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ (dig "tokenSecret" "name" $svc | default (printf "%s-token" $saName)) }}
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: {{ $saName }}
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/ignore-differences: |
      jsonPointers:
      - /data
      - /metadata/annotations/kubernetes.io~1service-account.uid
type: kubernetes.io/service-account-token
{{- end }}

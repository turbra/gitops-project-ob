{{- if and .Values.serviceaccount.name .Values.serviceaccount.tokenSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceaccount.tokenSecret.name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceaccount.name }}
    argocd.argoproj.io/sync-wave: "2"
    # Prevent Argo CD drift because the controller adds /data and a UID annotation.
    argocd.argoproj.io/ignore-differences: |
      jsonPointers:
      - /data
      - /metadata/annotations/kubernetes.io~1service-account.uid
type: kubernetes.io/service-account-token
{{- end }}

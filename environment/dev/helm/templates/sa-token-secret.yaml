{{- $ns := .Values.namespace.name | default "" -}}
{{- $svcRaw := .Values.serviceaccount | default dict -}}
{{- $saName := "" -}}
{{- $enabled := false -}}
{{- $secretName := "" -}}

{{- if kindIs "map" $svcRaw -}}
  {{- $saName = (get $svcRaw "name" | default "") -}}
  {{- $ts := (get $svcRaw "tokenSecret" | default dict) -}}
  {{- if kindIs "map" $ts -}}
    {{- $enabled = (get $ts "enabled" | default false) -}}
    {{- $secretName = (get $ts "name" | default (printf "%s-token" $saName)) -}}
  {{- end -}}
{{- end -}}

{{- if and $enabled $saName $ns }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: {{ $saName }}
    argocd.argoproj.io/sync-wave: "2"
type: kubernetes.io/service-account-token
{{- end }}


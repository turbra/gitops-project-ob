{{- $ns := .Values.namespace.name | required "A namespace name is required under .Values.namespace.name" -}}
{{- $sa := .Values.serviceaccount.name | default "" -}}
{{- $enabled := (dig "serviceaccount" "tokenSecret" "enabled" .Values false) -}}

{{- /* Only render the secret if it's enabled and an SA name is provided */ -}}
{{- if and $enabled $sa }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ (dig "serviceaccount" "tokenSecret" "name" .Values | default (printf "%s-token" $sa)) }}
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: {{ $sa }}
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/ignore-differences: |
      jsonPointers:
      - /data
      - /metadata/annotations/kubernetes.io~1service-account.uid
type: kubernetes.io/service-account-token
{{- end }}
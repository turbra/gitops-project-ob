{{- if and .Values.serviceaccount.name .Values.serviceaccount.tokenSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceaccount.tokenSecret.name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceaccount.name }}
    argocd.argoproj.io/sync-wave: "2"
    # If you want to suppress drift from controller-injected fields at the resource level:
    # argocd.argoproj.io/compare-options: IgnoreExtraneous
type: kubernetes.io/service-account-token
{{- end }}

